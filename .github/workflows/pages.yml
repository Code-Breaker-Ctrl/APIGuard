name: Deploy demo to GitHub Pages

# Builds the dashboard in demo mode (VITE_DEMO=1): it replays real engine runs
# recorded by scripts/record_demo.py, so no backend is needed on Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Turns Pages on for the repo if it isn't already (needs permission; skipped otherwise).
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (demo mode)
        working-directory: frontend
        env:
          VITE_DEMO: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
